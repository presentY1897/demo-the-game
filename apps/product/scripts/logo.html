<!doctype html>
<!-- 조직 JSON-LD의 logo(512×512) 원본. node scripts/make-images.mjs 로 public/logo.png 생성 -->
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 512px; height: 512px; }
  body {
    background: #103F3D;
    color: #F0FBFA;
    font-family: 'DejaVu Sans', sans-serif;
    display: grid;
    place-items: center;
  }
  .mark { text-align: center; }
  .glyph { font-size: 190px; font-weight: 800; line-height: 1; letter-spacing: -0.06em; }
  .glyph em { font-style: normal; color: #38BAB5; }
  .word { margin-top: 18px; font-size: 40px; font-weight: 700; letter-spacing: 0.02em; }
</style>
<div class="mark">
  <div class="glyph">T<em>G</em></div>
  <div class="word">TheGame</div>
</div>
